<style>
/* ---- admin 전용 ---- */
.adm-draft{margin:0 16px 10px;background:#FFF4E5;border:1.5px solid #F0B46A;border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;color:#3a2a14}
#adm .adm-draft{margin:0 0 10px}
.adm-draft b{display:block;font-size:14.5px;margin-bottom:2px}
.adm-draft-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.adm-draft[hidden]{display:none}
#sellerUI{height:100%}
.adm-bar{position:fixed;top:6px;right:8px;z-index:60;display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;box-shadow:var(--shadow);font-size:12.5px}
.adm-bar a{color:var(--accent);font-weight:700;text-decoration:none}
.adm-bar select{border:0;background:var(--surface-2);border-radius:999px;padding:4px 8px;font:inherit;font-size:12.5px;color:var(--ink);max-width:140px}
html,body{margin:0}
.who[hidden],.app[hidden],#sellerUI[hidden]{display:none!important}
.filters{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.chip.team{background:var(--surface-2)}
.chip.team[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.day .marks{flex-wrap:wrap;justify-content:center;height:auto;max-width:34px;row-gap:2px}
.day{height:auto;min-height:60px;padding-bottom:6px}
.day .cnt{font-size:9px;color:var(--muted);line-height:1}
.sel-group{margin-top:14px}
.sel-head{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.sel-head b{font-size:16px}
.sel-head .team-badge{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 8px}
.sel-head a{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none}
.sel-head .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
.mini{display:flex;flex-direction:column;gap:6px}
.mini .entry{grid-template-columns:auto 1fr;padding:11px 13px}
.mini .fmt{width:40px;height:40px;font-size:10.5px}
.e-prod{display:inline-flex;align-items:center;gap:5px}
.load-note{margin:10px 2px;font-size:12px;color:var(--muted)}
.sale-row .sname{font-size:11px;font-weight:700;color:var(--muted);margin-right:4px}
.sales-wrap{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.sales-wrap h4{margin:6px 2px 0;font-size:12.5px;color:var(--muted)}
.empty-day{padding:18px;text-align:center;color:var(--muted);background:var(--surface);border-radius:16px;font-size:14px}
</style>

<div class="who" id="admgate" role="dialog" aria-modal="true" aria-labelledby="pw-title" style="background:var(--bg)">
  <form class="who-card" id="pw-form" autocomplete="off">
    <h3 id="pw-title">비밀번호를 입력해 주세요</h3>
    <input id="adm-name" type="text" placeholder="이름" aria-label="이름" style="margin-bottom:8px" hidden>
    <input id="pw" type="password" inputmode="text" placeholder="비밀번호" aria-label="비밀번호">
    <p id="pw-err" style="margin:8px 2px 0;font-size:13px;color:var(--sun);min-height:18px"></p>
    <button type="submit" style="width:100%;height:48px;margin-top:6px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px">확인</button>
  </form>
</div>

<div id="sellerUI" hidden></div>
<div class="app" id="adm" hidden>
  __BRAND__
  <section class="view" aria-label="전체 셀러 캘린더">
    <div class="topbar">
      <div><div class="eyebrow" id="eyebrow">admin · 전체 셀러</div><div class="h-title" id="mtitle">11월</div></div>
      <div class="cal-head">
        <button class="today-btn" type="button" id="today">오늘</button>
        <button class="icon-btn" type="button" id="prev" aria-label="이전 달"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="icon-btn" type="button" id="next" aria-label="다음 달"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="filters" id="teams"></div>
    <div class="filters" id="sellers"></div>
    <div class="filters" id="opens"></div>
    <div class="scroll" id="scroll" style="padding-bottom:40px">
      <div class="adm-draft" id="drafts" hidden></div>
      <div class="sales-wrap" id="sales"></div>
      <div class="cal-card">
        <div class="wk"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
        <div class="grid" id="grid"></div>
        <div class="mk-legend" id="legend"></div>
      </div>
      <div class="load-note" id="note">셀러 캘린더를 불러오는 중이에요…</div>
      <div class="agenda" id="agenda"></div>
    </div>
  </section>
</div>

<script>
(function () {   // admin 화면 코드는 따로 감싸서, 같은 페이지에 그리는 셀러 화면 코드와 이름이 겹치지 않게
const SELLERS = [
  {team:"A팀", name:"방효선", repo:"imxux9",       c:"#E07A5F"},
  {team:"A팀", name:"초아",   repo:"minjinchoa",   c:"#F2B134"},
  {team:"A팀", name:"미자",   repo:"mija_uni",     c:"#81B29A"},
  {team:"B팀", name:"베르베르", repo:"berberlog",  c:"#5B8DEF"},
  {team:"B팀", name:"덕덕",   repo:"duckduck0613", c:"#9B6FD3"},
  {team:"B팀", name:"한기솔", repo:"___solvely___",c:"#E86A9E"},
  {team:"C팀", name:"뽕커벨", repo:"paorang73",    c:"#C0392B"},
  {team:"C팀", name:"스미홈트", repo:"smitruti1010",c:"#2A9D8F"},
  {team:"C팀", name:"에나스쿨", repo:"shinyoung_h", c:"#8D6E63"},
];
const TEAMS = ["전체", "A팀", "B팀", "C팀"];
const DOW = ["일","월","화","수","목","금","토"];
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const md = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain = s => String(s ?? "").replace(/⟪[^⟫]*⟫/g, "").replace(/⟦([^|⟧]*)\|[^⟧]*⟧/g, "$1").replace(/\s+/g, " ").trim();
const FMT = f => /릴스|reel/i.test(f) ? ["릴스","reel"] : /스토리|story/i.test(f) ? ["스토리","story"] : /캐러셀|carousel/i.test(f) ? ["캐러셀",""] : /피드|게시물|post/i.test(f) ? ["피드","post"] : [f ? String(f).slice(0,3) : "일정", ""];

function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

let team = load("adm.team", "전체");
let off = new Set(load("adm.off", []));          // 끈 셀러
const today = key(new Date());
let sel = today;
let cur = new Date(); cur.setDate(1);
const ALL = {};                                     // repo -> {uploads, events, sales}

function shown() { return SELLERS.filter(s => (team === "전체" || s.team === team) && !off.has(s.repo) && ALL[s.repo]); }

function firstText(slot) {
  if (slot.title) return plain(slot.title);
  for (const it of slot.items || []) for (const [k, v] of Object.entries(it)) if (!k.startsWith("__") && typeof v === "string" && plain(v)) return plain(v).slice(0, 60);
  return "";
}

function digest(s, D) {
  const uploads = [], events = [], sales = [];
  for (const p of D.products || []) {
    const pname = p.name + (p.round ? " " + p.round : "");
    if (p.period && p.period[0]) sales.push({s: p.period[0], e: p.period[1] || p.period[0], name: pname, color: p.color});
    for (const sl of p.slots || []) if (sl.date) uploads.push({date: sl.date, prod: pname, pc: p.color, format: sl.format, label: sl.label, text: firstText(sl)});
  }
  for (const e of D.events || []) events.push({date: e.date, end: e.end || e.date, text: plain(e.text), kind: e.kind, prod: e.product});
  return {uploads, events, sales, updated: D.updated};
}

function renderFilters() {
  $("#teams").innerHTML = TEAMS.map(t => `<button class="chip team" type="button" data-t="${t}" aria-pressed="${t === team}">${t}</button>`).join("");
  const list = SELLERS.filter(s => team === "전체" || s.team === team);
  $("#sellers").innerHTML = list.map(s => `<button class="chip" type="button" data-s="${s.repo}" aria-pressed="${!off.has(s.repo)}" style="--c:${s.c}"><i></i>${esc(s.name)}${ALL[s.repo] ? "" : " …"}</button>`).join("");
  $("#opens").innerHTML = `<span style="flex:none;font-size:12px;color:var(--muted);align-self:center">셀러 화면 열기</span>` + list.map(s => `<a class="chip" href="?s=${s.repo}" style="--c:${s.c};text-decoration:none;color:inherit"><i></i>${esc(s.name)} →</a>`).join("");
  $("#teams").onclick = ev => { const b = ev.target.closest("[data-t]"); if (!b) return; team = b.dataset.t; save("adm.team", team); renderAll(); };
  $("#sellers").onclick = ev => { const b = ev.target.closest("[data-s]"); if (!b) return; const r = b.dataset.s; off.has(r) ? off.delete(r) : off.add(r); save("adm.off", [...off]); renderAll(); };
}

function renderSales() {
  const live = [], soon = [];
  const in14 = key(new Date(Date.now() + 14 * 864e5));
  for (const s of shown()) for (const r of ALL[s.repo].sales) {
    if (r.s <= today && today <= r.e) live.push({s, r});
    else if (r.s > today && r.s <= in14) soon.push({s, r});
  }
  soon.sort((a, b) => a.r.s.localeCompare(b.r.s));
  const row = ({s, r}, isLive) => {
    const dd = Math.round((parse(r.s) - parse(today)) / 864e5);
    return `<a class="sale-row${isLive ? " live" : ""}" href="?s=${s.repo}" style="--c:${s.c};text-decoration:none;color:inherit"><div class="t"><div class="k"><span class="sname">${esc(s.name)}</span>${isLive ? "진행 중 공구" : "다음 공구"}</div><div class="nm">${esc(r.name)}</div></div><div class="v"><b>${isLive ? "~" + md(r.e) : "D-" + dd}</b><small>${md(r.s)}–${md(r.e)}</small></div></a>`;
  };
  $("#sales").innerHTML = (live.length ? `<h4>진행 중 공구 ${live.length}</h4>` + live.map(x => row(x, true)).join("") : "")
    + (soon.length ? `<h4>2주 안에 열리는 공구 ${soon.length}</h4>` + soon.map(x => row(x, false)).join("") : "");
}

function dayItems(k) {
  const out = [];
  for (const s of shown()) {
    const A = ALL[s.repo];
    const ups = A.uploads.filter(u => u.date === k);
    const evs = A.events.filter(e => e.date <= k && k <= e.end && e.kind !== "holiday" && !(e.kind === "content" && ups.length));
    const opens = A.sales.filter(r => r.s === k);
    if (ups.length || evs.length || opens.length) out.push({s, ups, evs, opens});
  }
  return out;
}

function renderGrid() {
  const y = cur.getFullYear(), m = cur.getMonth();
  $("#mtitle").textContent = `${m + 1}월`;
  $("#eyebrow").textContent = `${y}년 · admin 전체 셀러`;
  const first = new Date(y, m, 1), start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = key(d), items = dayItems(k);
    const cls = ["day"]; if (d.getMonth() !== m) cls.push("out"); if (k === today) cls.push("today"); if (k === sel) cls.push("sel");
    if (d.getDay() === 6) cls.push("sat"); if (d.getDay() === 0) cls.push("sun");
    const dots = items.slice(0, 6).map(x => `<i class="sdot" style="--c:${x.s.c}"></i>`).join("") + (items.length > 6 ? `<span class="cnt">+${items.length - 6}</span>` : "");
    const open = items.some(x => x.opens.length) ? `<span class="open-tag">OPEN</span>` : "";
    cells.push(`<button type="button" class="${cls.join(" ")}" data-k="${k}"><span class="n">${d.getDate()}</span><span class="marks">${dots}</span>${open}</button>`);
  }
  $("#grid").innerHTML = cells.join("");
  $("#grid").onclick = ev => { const b = ev.target.closest("[data-k]"); if (!b) return; sel = b.dataset.k; renderGrid(); renderAgenda(); };
  $("#legend").innerHTML = shown().map(s => `<span><i class="sdot" style="--c:${s.c}"></i>${esc(s.name)}</span>`).join("");
}

function renderAgenda() {
  const d = parse(sel);
  const groups = dayItems(sel);
  let h = `<div class="ag-date"><span class="big">${d.getMonth() + 1}월 ${d.getDate()}일</span><span class="dow">${DOW[d.getDay()]}요일${sel === today ? " · 오늘" : ""}</span></div>`;
  if (!groups.length) h += `<div class="empty-day">이날은 등록된 일정이 없어요.</div>`;
  for (const g of groups) {
    h += `<div class="sel-group"><div class="sel-head" style="--c:${g.s.c}"><span class="sw"></span><b>${esc(g.s.name)}</b><span class="team-badge">${g.s.team}</span><a href="?s=${g.s.repo}">전체 화면 보기 →</a></div><div class="mini">`;
    for (const r of g.opens) h += `<div class="entry"><div class="fmt" style="background:${r.color || "var(--accent-soft)"};color:#2E2520">OPEN</div><div class="e-body"><div class="e-title">${esc(r.name)} 공구 오픈</div><div class="e-meta">${md(r.s)}–${md(r.e)}</div></div></div>`;
    for (const u of g.ups) { const [f, fc] = FMT(u.format);
      h += `<div class="entry"><div class="fmt ${fc}">${esc(f)}</div><div class="e-body"><div class="e-title">${esc(u.text || u.prod + " " + (u.label || ""))}</div><div class="e-meta"><span class="e-prod"><i class="dotc" style="--c:${u.pc || g.s.c}"></i>${esc(u.prod)}</span>${u.label ? `<span>${esc(u.label)}</span>` : ""}</div></div></div>`; }
    for (const e of g.evs) h += `<div class="entry"><div class="fmt meeting">${e.kind === "meeting" ? "미팅" : "일정"}</div><div class="e-body"><div class="e-title">${esc(e.text)}</div>${e.end !== e.date ? `<div class="e-meta">${md(e.date)}–${md(e.end)}</div>` : ""}</div></div>`;
    h += `</div></div>`;
  }
  $("#agenda").innerHTML = h;
}

function renderAll() { renderFilters(); renderSales(); renderGrid(); renderAgenda(); }

$("#prev").onclick = () => { cur.setMonth(cur.getMonth() - 1); renderGrid(); };
$("#next").onclick = () => { cur.setMonth(cur.getMonth() + 1); renderGrid(); };
$("#today").onclick = () => { cur = new Date(); cur.setDate(1); sel = today; renderGrid(); renderAgenda(); };

// ---- 비밀번호 (해시로만 비교; 맞히면 이 기기에서는 다시 묻지 않음) ----
const PW_HASH = "e581acc52af1a4d99f19a45731f3dc4eaaa8e3a7cb940bbd117480ad40907e29";
async function sha(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
function unlock() { $("#admgate").hidden = true; route(); }
const VIEWER = load("viewer", {});            // 셀러 캘린더와 같은 이름 기록(같은 기기면 같이 씀)
if (load("adm.ok", "") === PW_HASH && VIEWER.name) setTimeout(unlock, 0);   // 아래 코드가 다 읽힌 뒤에 열기
else {
  if (load("adm.ok", "") === PW_HASH) { $("#pw").hidden = true; $("#pw-title").textContent = "이름을 입력해 주세요"; }
  if (!VIEWER.name) $("#adm-name").hidden = false;
  setTimeout(() => (VIEWER.name ? $("#pw") : $("#adm-name")).focus(), 50);
}
$("#pw-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  if (!VIEWER.name) {
    const nm = $("#adm-name").value.trim();
    if (!nm) { $("#pw-err").textContent = "이름을 입력해 주세요."; return $("#adm-name").focus(); }
    VIEWER.name = nm; VIEWER.id = VIEWER.id || Math.random().toString(36).slice(2, 10); save("viewer", VIEWER);
  }
  if (load("adm.ok", "") === PW_HASH) return unlock();
  const h = await sha($("#pw").value.trim());
  if (h === PW_HASH) { save("adm.ok", PW_HASH); unlock(); }
  else { $("#pw-err").textContent = "비밀번호가 맞지 않아요. 다시 입력해 주세요."; $("#pw").select(); }
});

// ---- 조회 기록 (셀러 캘린더와 같은 비공개 시트, 셀러 이름은 'admin') ----
function admLog(type, title, context) {
  if (!window.LOG_URL_ADM || !VIEWER.name) return;
  const u = navigator.userAgent, device = /iPhone|iPod/.test(u) ? "아이폰" : /iPad/.test(u) ? "아이패드" : /Android/.test(u) ? "안드로이드" : "PC";
  try { fetch(window.LOG_URL_ADM, {method: "POST", mode: "no-cors", keepalive: true, headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({seller: "admin", name: VIEWER.name, id: VIEWER.id, device, type, title: title || "", context: context || ""})}).catch(() => {}); } catch (e) {}
}

// ---- 어떤 화면을 열지: 주소에 ?s=셀러 가 있으면 그 셀러의 전체 캘린더, 없으면 전체 보기 ----
function route() {
  const repo = new URLSearchParams(location.search).get("s");
  const s = SELLERS.find(x => x.repo === repo);
  if (s) return loadSeller(s);
  $("#adm").hidden = false;
  admLog("open", "전체 보기");
  start();
  // 휴대폰 뒤로가기: 설치 창이 떠 있으면 닫고, 아니면 '한 번 더 누르면 나가요' 후 두 번째에 나감
  let armed = 0;
  const guard = () => { try { history.pushState({admGuard: 1}, ""); } catch (e) {} };
  try { history.replaceState({admBase: 1}, ""); } catch (e) {}
  guard();
  window.addEventListener("popstate", () => {
    const inst = document.getElementById("inst");
    if (inst && !inst.hidden) { inst.hidden = true; return guard(); }
    if (Date.now() - armed < 2000) { history.back(); return; }
    armed = Date.now(); admToast("뒤로 버튼을 한 번 더 누르면 나가요"); guard();
  });
}
function admToast(msg) {
  let el = document.getElementById("adm-toast");
  if (!el) { el = document.createElement("div"); el.id = "adm-toast"; el.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap"; document.body.appendChild(el); }
  el.textContent = msg; el.style.opacity = "1"; clearTimeout(el._t); el._t = setTimeout(() => { el.style.opacity = "0"; }, 1800);
}
async function loadSeller(s) {
  const base = new URL(`../${s.repo}/`, location.href).href;
  const get = async f => { try { const r = await fetch(base + f + "?t=" + Date.now(), {cache: "no-store"}); return r.ok ? await r.json() : null; } catch (e) { return null; } };
  const ui = $("#sellerUI"); ui.hidden = false;
  ui.innerHTML = `<div style="padding:40px 20px;text-align:center;color:var(--muted)">${esc(s.name)}님 캘린더를 불러오는 중이에요…</div>`;
  const draftUrl = new URL(`drafts/${s.repo}/opinion.json?t=${Date.now()}`, location.href).href;   // admin 주소 기준
  const getDraft = async () => { try { const r = await fetch(draftUrl, {cache: "no-store"}); return r.ok ? await r.json() : null; } catch (e) { return null; } };
  const [cfg, data, ideas, liveOpinion, draft] = await Promise.all([get("config.json"), get("data.json"), get("ideas.json"), get("opinion.json"), getDraft()]);
  const opinion = draft || liveOpinion;
  if (!data) { ui.innerHTML = `<div style="padding:40px 20px;text-align:center;color:var(--muted)">${esc(s.name)}님 캘린더를 불러오지 못했어요. <a href="./">전체 보기로</a></div>`; return; }
  window.__ADM = {data, ideas, opinion};
  const seller = (cfg && cfg.seller) || (s.name + "님");
  const fill = x => x.split("__SELLER__").join(seller).split("__APP_NAME__").join((cfg && cfg.app_name) || seller + " 콘텐츠 캘린더").split("__UPCOMING__").join(String((cfg && cfg.upcoming_days) || 3));
  document.title = `admin · ${seller}`;
  const b = document.createElement("base"); b.href = base; document.head.prepend(b);   // 사진·캘린더 구독 주소는 셀러 사이트 기준
  ui.innerHTML = fill(window.ADM_TBODY);
  // 위쪽 작은 막대: 전체 보기로 / 다른 셀러로
  const bar = document.createElement("div"); bar.className = "adm-bar";
  bar.innerHTML = `<a href="${new URL("./", location.href).href}">← 전체</a><select aria-label="셀러 바꾸기">${SELLERS.map(x => `<option value="${x.repo}"${x.repo === s.repo ? " selected" : ""}>${x.team} · ${esc(x.name)}</option>`).join("")}</select>`;
  bar.querySelector("select").onchange = ev => { location.href = new URL("./?s=" + ev.target.value, location.href.split("?")[0]).href; };
  document.body.appendChild(bar);
  const sc = document.createElement("script"); sc.textContent = fill(window.ADM_TJS); document.body.appendChild(sc);
  if (draft) {   // 검토 대기 안내 (셀러 캘린더에는 아직 안 나간 내용)
    const box = document.createElement("div"); box.className = "adm-draft";
    const liveAt = liveOpinion && liveOpinion.at ? `${liveOpinion.at} 정리본` : "아직 없음";
    box.innerHTML = `<b>검토 대기 중인 새 댓글 여론이에요</b><span>${esc(draft.from || "")}~${esc(draft.to || "")} · ${esc(draft.at || "")} 정리. 셀러 캘린더에는 아직 적용되지 않았어요 (지금 셀러 화면: ${esc(liveAt)}). 확인 후 적용을 요청해 주세요.</span>`;
    const op = document.querySelector("#sellerUI #op-scroll"); if (op) op.parentNode.insertBefore(box, op);
  }
}

var started = false;
async function showDrafts() {
  try {
    const r = await fetch(new URL("drafts/index.json?t=" + Date.now(), location.href).href, {cache: "no-store"});
    const list = r.ok ? await r.json() : [];
    const ss = list.map(repo => SELLERS.find(s => s.repo === repo)).filter(Boolean);
    if (!ss.length) return;
    $("#drafts").innerHTML = `<b>검토 대기 댓글 여론 ${ss.length}</b><span>셀러 캘린더에는 아직 적용되지 않았어요. 눌러서 확인하세요.</span><div class="adm-draft-links">${ss.map(s => `<a class="chip" href="?s=${s.repo}#opinion" style="--c:${s.c};text-decoration:none;color:inherit"><i></i>${esc(s.name)} →</a>`).join("")}</div>`;
    $("#drafts").hidden = false;
  } catch (e) {}
}
function start() {
if (started) return; started = true;
showDrafts();
renderAll();
let done = 0, failed = [];
SELLERS.forEach(s => fetch(`../${s.repo}/data.json?t=${Date.now()}`, {cache: "no-store"})
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(D => { ALL[s.repo] = digest(s, D); })
  .catch(() => failed.push(s.name))
  .finally(() => {
    done++;
    renderAll();
    $("#note").textContent = done < SELLERS.length ? `셀러 캘린더를 불러오는 중이에요… (${done}/${SELLERS.length})`
      : failed.length ? `불러오지 못한 셀러: ${failed.join(", ")} — 잠시 후 다시 열어 주세요.` : `셀러 ${SELLERS.length}명의 캘린더를 모두 불러왔어요. 셀러를 눌러 켜고 끌 수 있어요.`;
  }));
// 5분마다 새로 불러오기 (셀러 시트가 바뀌면 반영)
setInterval(() => SELLERS.forEach(s => fetch(`../${s.repo}/data.json?t=${Date.now()}`, {cache: "no-store"}).then(r => r.json()).then(D => { ALL[s.repo] = digest(s, D); renderAll(); }).catch(() => {})), 5 * 60 * 1000);
}
window.__admin = {SELLERS, loadSeller, unlock, route};
})();
</script>
